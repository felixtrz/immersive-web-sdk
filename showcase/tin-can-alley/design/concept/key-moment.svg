<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Tin Can Alley key moment: player POV mid-throw at a neon carnival booth">
  <title>Tin Can Alley — Key Moment (player POV, mid-throw)</title>
  <defs>
    <!-- palette: indigo night #1a1a3e / amber #ffb347 / booth red #d43d2a / cream #f5e9d0 / can silver -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08081c"/>
      <stop offset="0.45" stop-color="#1a1a3e"/>
      <stop offset="1" stop-color="#33336b"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c44"/>
      <stop offset="1" stop-color="#08081a"/>
    </linearGradient>
    <linearGradient id="awnRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2543e"/>
      <stop offset="1" stop-color="#b02f1f"/>
    </linearGradient>
    <linearGradient id="awnCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8eed8"/>
      <stop offset="1" stop-color="#e0cfa9"/>
    </linearGradient>
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7583"/>
      <stop offset="0.18" stop-color="#d9dee6"/>
      <stop offset="0.42" stop-color="#f2f5f9"/>
      <stop offset="0.75" stop-color="#9aa0ae"/>
      <stop offset="1" stop-color="#5c6270"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a28"/>
      <stop offset="1" stop-color="#38231a"/>
    </linearGradient>
    <linearGradient id="handGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a70"/>
      <stop offset="1" stop-color="#15152f"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="0.36" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fdf6e4"/>
      <stop offset="0.55" stop-color="#f0e0bd"/>
      <stop offset="1" stop-color="#c8b184"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd88a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc76b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc76b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#050510" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#050510" stop-opacity="0"/>
      <stop offset="1" stop-color="#050510" stop-opacity="0.62"/>
    </radialGradient>
    <clipPath id="awnClip">
      <polygon points="500,152 1100,152 1136,252 464,252"/>
    </clipPath>
    <!-- tin can: 40 x 58, bottom edge at y=0 -->
    <g id="can">
      <rect x="-20" y="-56" width="40" height="54" rx="4" fill="url(#canBody)"/>
      <rect x="-20" y="-38" width="40" height="13" fill="#c8402d"/>
      <ellipse cx="0" cy="-56" rx="20" ry="6" fill="#dfe3ea"/>
      <ellipse cx="0" cy="-56" rx="13.5" ry="3.8" fill="#a9afbb"/>
      <path d="M -20 -56 A 20 6 0 0 1 20 -56" fill="none" stroke="#fff6df" stroke-width="1.6" opacity="0.8"/>
    </g>
  </defs>

  <!-- LAYER 1: night sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)"/>
  <g fill="#f5e9d0">
    <circle cx="120" cy="90" r="2.2" opacity="0.8"/>
    <circle cx="255" cy="180" r="1.4" opacity="0.5"/>
    <circle cx="340" cy="60" r="1.8" opacity="0.7"/>
    <circle cx="470" cy="130" r="1.2" opacity="0.4"/>
    <circle cx="610" cy="55" r="1.6" opacity="0.6"/>
    <circle cx="760" cy="105" r="1.2" opacity="0.45"/>
    <circle cx="905" cy="45" r="2" opacity="0.75"/>
    <circle cx="1030" cy="150" r="1.3" opacity="0.5"/>
    <circle cx="1180" cy="70" r="1.7" opacity="0.65"/>
    <circle cx="1320" cy="160" r="1.2" opacity="0.4"/>
    <circle cx="1450" cy="95" r="2.2" opacity="0.8"/>
    <circle cx="1545" cy="210" r="1.4" opacity="0.5"/>
    <circle cx="185" cy="290" r="1.2" opacity="0.35"/>
    <circle cx="1390" cy="300" r="1.3" opacity="0.35"/>
  </g>

  <!-- LAYER 2: far carnival silhouettes + fog -->
  <g fill="#15153a" opacity="0.75">
    <polygon points="0,620 0,560 90,522 180,560 180,620"/>
    <polygon points="200,620 200,575 275,545 350,575 350,620"/>
    <polygon points="1290,620 1290,565 1380,528 1470,565 1470,620"/>
    <polygon points="1480,620 1480,580 1600,552 1600,620"/>
  </g>
  <polygon points="90,522 84,500 104,508" fill="#d43d2a" opacity="0.7"/>
  <polygon points="1380,528 1374,506 1394,514" fill="#d43d2a" opacity="0.7"/>
  <rect x="0" y="575" width="1600" height="55" fill="#33336b" opacity="0.22"/>

  <!-- LAYER 3: ground + light pool -->
  <rect x="0" y="618" width="1600" height="282" fill="url(#groundGrad)"/>
  <ellipse cx="800" cy="665" rx="440" ry="72" fill="url(#poolGlow)"/>

  <!-- LAYER 4: string lights overhead -->
  <g>
    <path d="M -20 40 Q 500 118 1020 58 Q 1310 28 1620 88" fill="none" stroke="#3a3a6a" stroke-width="3"/>
    <path d="M -20 92 Q 400 232 820 122 Q 1200 32 1620 142" fill="none" stroke="#3a3a6a" stroke-width="4"/>
    <g>
      <circle cx="180" cy="140" r="22" fill="url(#bulbGlow)"/><circle cx="180" cy="140" r="7" fill="#ffd88a"/>
      <circle cx="400" cy="192" r="24" fill="url(#bulbGlow)"/><circle cx="400" cy="192" r="8" fill="#ffd88a"/>
      <circle cx="620" cy="180" r="22" fill="url(#bulbGlow)"/><circle cx="620" cy="180" r="7" fill="#ffd88a"/>
      <circle cx="960" cy="86" r="22" fill="url(#bulbGlow)"/><circle cx="960" cy="86" r="7" fill="#ffd88a"/>
      <circle cx="1210" cy="62" r="24" fill="url(#bulbGlow)"/><circle cx="1210" cy="62" r="8" fill="#ffd88a"/>
      <circle cx="1450" cy="106" r="22" fill="url(#bulbGlow)"/><circle cx="1450" cy="106" r="7" fill="#ffd88a"/>
      <circle cx="300" cy="98" r="16" fill="url(#bulbGlow)"/><circle cx="300" cy="98" r="5" fill="#f0c169"/>
      <circle cx="700" cy="92" r="16" fill="url(#bulbGlow)"/><circle cx="700" cy="92" r="5" fill="#f0c169"/>
      <circle cx="1120" cy="46" r="16" fill="url(#bulbGlow)"/><circle cx="1120" cy="46" r="5" fill="#f0c169"/>
    </g>
  </g>

  <!-- LAYER 5: the booth -->
  <ellipse cx="800" cy="626" rx="350" ry="18" fill="#000000" opacity="0.4"/>
  <rect x="500" y="250" width="600" height="312" fill="#0d0d22"/>
  <ellipse cx="800" cy="430" rx="270" ry="140" fill="url(#panelGlow)" opacity="0.28"/>
  <rect x="460" y="248" width="40" height="374" fill="url(#awnRed)"/>
  <rect x="1100" y="248" width="40" height="374" fill="url(#awnRed)"/>
  <rect x="460" y="596" width="40" height="12" fill="#e0cfa9"/>
  <rect x="1100" y="596" width="40" height="12" fill="#e0cfa9"/>

  <!-- shelf + cans: 3-2-1 pyramid, top can mid-tumble -->
  <rect x="570" y="468" width="460" height="16" fill="url(#woodGrad)"/>
  <line x1="570" y1="468" x2="1030" y2="468" stroke="#ffcf7a" stroke-width="2" opacity="0.45"/>
  <ellipse cx="800" cy="469" rx="130" ry="7" fill="#000000" opacity="0.35"/>
  <use href="#can" transform="translate(752,468)"/>
  <use href="#can" transform="translate(800,468)"/>
  <use href="#can" transform="translate(848,468)"/>
  <use href="#can" transform="translate(776,412)"/>
  <use href="#can" transform="translate(824,412)"/>
  <use href="#can" transform="translate(936,398) rotate(56)"/>
  <path d="M 872 336 Q 912 320 944 340" fill="none" stroke="#f5e9d0" stroke-width="3" opacity="0.5"/>
  <path d="M 860 358 Q 904 338 940 360" fill="none" stroke="#f5e9d0" stroke-width="2.5" opacity="0.3"/>
  <circle cx="890" cy="386" r="3" fill="#ffb347" opacity="0.85"/>
  <circle cx="912" cy="366" r="2.2" fill="#ffd88a" opacity="0.7"/>
  <path d="M 1120 480 Q 1000 330 930 372" fill="none" stroke="#ffd88a" stroke-width="3" stroke-dasharray="5 12" opacity="0.3"/>

  <!-- glowing score panel -->
  <line x1="700" y1="252" x2="700" y2="276" stroke="#3a3a6a" stroke-width="3"/>
  <line x1="900" y1="252" x2="900" y2="276" stroke="#3a3a6a" stroke-width="3"/>
  <ellipse cx="800" cy="322" rx="255" ry="98" fill="url(#panelGlow)"/>
  <rect x="640" y="276" width="320" height="92" rx="14" fill="#0d0d24" stroke="#ffb347" stroke-width="3"/>
  <rect x="650" y="286" width="300" height="72" rx="9" fill="none" stroke="#f5e9d0" stroke-width="1.2" opacity="0.25"/>
  <text x="800" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="36" letter-spacing="3" fill="#f5e9d0">SCORE 20</text>
  <circle cx="722" cy="344" r="8" fill="#f5e9d0"/>
  <circle cx="752" cy="344" r="8" fill="#f5e9d0"/>
  <circle cx="782" cy="344" r="8" fill="none" stroke="#f5e9d0" stroke-width="2" opacity="0.6"/>
  <text x="880" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="24" letter-spacing="2" fill="#ffb347">THROW!</text>

  <!-- counter with waiting balls -->
  <ellipse cx="620" cy="541" rx="22" ry="5" fill="#000000" opacity="0.4"/>
  <ellipse cx="668" cy="543" rx="20" ry="5" fill="#000000" opacity="0.4"/>
  <circle cx="620" cy="523" r="17" fill="url(#ballGrad)"/>
  <circle cx="668" cy="525" r="16" fill="url(#ballGrad)"/>
  <rect x="520" y="540" width="560" height="16" fill="url(#awnCream)"/>
  <rect x="520" y="556" width="560" height="64" rx="4" fill="url(#awnRed)"/>
  <line x1="530" y1="610" x2="1070" y2="610" stroke="#f5e9d0" stroke-width="3" opacity="0.5"/>

  <!-- LAYER 6: striped awning with scalloped fringe -->
  <g clip-path="url(#awnClip)">
    <rect x="464" y="152" width="672" height="100" fill="url(#awnCream)"/>
    <rect x="525" y="152" width="61" height="100" fill="url(#awnRed)"/>
    <rect x="647" y="152" width="61" height="100" fill="url(#awnRed)"/>
    <rect x="769" y="152" width="61" height="100" fill="url(#awnRed)"/>
    <rect x="891" y="152" width="61" height="100" fill="url(#awnRed)"/>
    <rect x="1013" y="152" width="61" height="100" fill="url(#awnRed)"/>
  </g>
  <rect x="492" y="142" width="616" height="12" rx="6" fill="url(#woodGrad)"/>
  <g>
    <circle cx="486" cy="252" r="22" fill="url(#awnRed)"/>
    <circle cx="543" cy="252" r="22" fill="url(#awnCream)"/>
    <circle cx="600" cy="252" r="22" fill="url(#awnRed)"/>
    <circle cx="657" cy="252" r="22" fill="url(#awnCream)"/>
    <circle cx="714" cy="252" r="22" fill="url(#awnRed)"/>
    <circle cx="771" cy="252" r="22" fill="url(#awnCream)"/>
    <circle cx="828" cy="252" r="22" fill="url(#awnRed)"/>
    <circle cx="885" cy="252" r="22" fill="url(#awnCream)"/>
    <circle cx="942" cy="252" r="22" fill="url(#awnRed)"/>
    <circle cx="999" cy="252" r="22" fill="url(#awnCream)"/>
    <circle cx="1056" cy="252" r="22" fill="url(#awnRed)"/>
    <circle cx="1113" cy="252" r="22" fill="url(#awnCream)"/>
  </g>

  <!-- LAYER 7: foreground — right hand mid-throw with cream softball -->
  <g transform="translate(58,6)">
  <path d="M 1590 700 Q 1430 688 1292 588" fill="none" stroke="#f5e9d0" stroke-width="7" opacity="0.26" stroke-linecap="round"/>
  <path d="M 1600 594 Q 1480 588 1338 516" fill="none" stroke="#f5e9d0" stroke-width="5" opacity="0.16" stroke-linecap="round"/>
  <path d="M 1318 690 Q 1270 612 1254 540" fill="none" stroke="#ffb347" stroke-width="4" opacity="0.3" stroke-linecap="round"/>
  <polygon points="1350,940 1516,940 1334,706 1214,738" fill="url(#handGrad)"/>
  <line x1="1222" y1="734" x2="1330" y2="710" stroke="#ffb347" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <ellipse cx="1256" cy="652" rx="72" ry="64" fill="url(#handGrad)" transform="rotate(-28 1256 652)"/>
  <circle cx="1170" cy="545" r="82" fill="url(#ballGrad)"/>
  <path d="M 1104 508 Q 1168 545 1128 616" fill="none" stroke="#d4a86a" stroke-width="3.5" opacity="0.85"/>
  <path d="M 1226 486 Q 1196 560 1240 612" fill="none" stroke="#d4a86a" stroke-width="3.5" opacity="0.85"/>
  <ellipse cx="1140" cy="502" rx="30" ry="19" fill="#fffaf0" opacity="0.75" transform="rotate(-24 1140 502)"/>
  <ellipse cx="1234" cy="498" rx="15" ry="30" fill="#44447e" transform="rotate(40 1234 498)"/>
  <ellipse cx="1256" cy="584" rx="17" ry="36" fill="#44447e" transform="rotate(52 1256 584)"/>
  <ellipse cx="1236" cy="620" rx="16" ry="34" fill="#3c3c72" transform="rotate(64 1236 620)"/>
  <ellipse cx="1204" cy="642" rx="15" ry="30" fill="#343466" transform="rotate(78 1204 642)"/>
  <path d="M 1214 480 Q 1236 466 1252 486" fill="none" stroke="#ffb347" stroke-width="4" opacity="0.85" stroke-linecap="round"/>
  <path d="M 1268 556 Q 1286 592 1274 628" fill="none" stroke="#ffb347" stroke-width="3.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M 1244 606 Q 1256 632 1246 654" fill="none" stroke="#ffb347" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
  <path d="M 1206 630 Q 1218 652 1208 670" fill="none" stroke="#ffb347" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M 1200 692 Q 1252 712 1304 694" fill="none" stroke="#ffb347" stroke-width="3" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- LAYER 8: vignette -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#vign)"/>
</svg>
