<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Tin Can Alley score panel mock: header, score readout, ball dots, THROW banner, reset button">
  <title>Tin Can Alley — Score Panel UI Mock (1.2 m x 0.5 m)</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a20"/>
      <stop offset="1" stop-color="#181838"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20204a"/>
      <stop offset="1" stop-color="#101028"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2543e"/>
      <stop offset="1" stop-color="#b02f1f"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="0.36" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fdf6e4"/>
      <stop offset="0.55" stop-color="#f0e0bd"/>
      <stop offset="1" stop-color="#c8b184"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd88a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc76b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffc76b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0" stop-color="#050510" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#050510" stop-opacity="0"/>
      <stop offset="1" stop-color="#050510" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- backdrop: night, faint stars, warm glow behind the panel -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#bgGrad)"/>
  <g fill="#f5e9d0">
    <circle cx="140" cy="80" r="1.6" opacity="0.4"/>
    <circle cx="420" cy="60" r="1.2" opacity="0.3"/>
    <circle cx="820" cy="50" r="1.8" opacity="0.45"/>
    <circle cx="1200" cy="75" r="1.3" opacity="0.3"/>
    <circle cx="1480" cy="95" r="1.6" opacity="0.4"/>
    <circle cx="80" cy="820" r="1.3" opacity="0.25"/>
    <circle cx="1530" cy="840" r="1.4" opacity="0.3"/>
  </g>
  <ellipse cx="800" cy="450" rx="820" ry="400" fill="url(#panelGlow)"/>

  <!-- panel body: 1344 x 560 = 2.4:1, matching 1.2 m x 0.5 m -->
  <rect x="140" y="182" width="1344" height="560" rx="28" fill="#000000" opacity="0.45"/>
  <rect x="128" y="170" width="1344" height="560" rx="28" fill="url(#panelGrad)" stroke="#ffb347" stroke-width="5"/>
  <rect x="146" y="188" width="1308" height="524" rx="20" fill="none" stroke="#f5e9d0" stroke-width="2" opacity="0.3"/>

  <!-- marquee bulbs along the top edge -->
  <g>
    <circle cx="260" cy="170" r="14" fill="url(#bulbGlow)"/><circle cx="260" cy="170" r="6" fill="#ffd88a"/>
    <circle cx="356" cy="170" r="6" fill="#7a5a2e"/>
    <circle cx="452" cy="170" r="14" fill="url(#bulbGlow)"/><circle cx="452" cy="170" r="6" fill="#ffd88a"/>
    <circle cx="548" cy="170" r="6" fill="#7a5a2e"/>
    <circle cx="644" cy="170" r="14" fill="url(#bulbGlow)"/><circle cx="644" cy="170" r="6" fill="#ffd88a"/>
    <circle cx="740" cy="170" r="6" fill="#7a5a2e"/>
    <circle cx="836" cy="170" r="14" fill="url(#bulbGlow)"/><circle cx="836" cy="170" r="6" fill="#ffd88a"/>
    <circle cx="932" cy="170" r="6" fill="#7a5a2e"/>
    <circle cx="1028" cy="170" r="14" fill="url(#bulbGlow)"/><circle cx="1028" cy="170" r="6" fill="#ffd88a"/>
    <circle cx="1124" cy="170" r="6" fill="#7a5a2e"/>
    <circle cx="1220" cy="170" r="14" fill="url(#bulbGlow)"/><circle cx="1220" cy="170" r="6" fill="#ffd88a"/>
    <circle cx="1316" cy="170" r="6" fill="#7a5a2e"/>
    <circle cx="1412" cy="170" r="14" fill="url(#bulbGlow)"/><circle cx="1412" cy="170" r="6" fill="#ffd88a"/>
  </g>
  <!-- corner bulbs -->
  <circle cx="166" cy="208" r="16" fill="url(#bulbGlow)"/><circle cx="166" cy="208" r="7" fill="#ffd88a"/>
  <circle cx="1434" cy="208" r="16" fill="url(#bulbGlow)"/><circle cx="1434" cy="208" r="7" fill="#ffd88a"/>
  <circle cx="166" cy="692" r="16" fill="url(#bulbGlow)"/><circle cx="166" cy="692" r="7" fill="#ffd88a"/>
  <circle cx="1434" cy="692" r="16" fill="url(#bulbGlow)"/><circle cx="1434" cy="692" r="7" fill="#ffd88a"/>

  <!-- header -->
  <text x="800" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="82" letter-spacing="6" fill="#f5e9d0">TIN CAN ALLEY</text>
  <rect x="316" y="242" width="26" height="26" fill="#ffb347" transform="rotate(45 329 255)"/>
  <rect x="1258" y="242" width="26" height="26" fill="#ffb347" transform="rotate(45 1271 255)"/>
  <rect x="264" y="248" width="14" height="14" fill="#ffb347" opacity="0.6" transform="rotate(45 271 255)"/>
  <rect x="1322" y="248" width="14" height="14" fill="#ffb347" opacity="0.6" transform="rotate(45 1329 255)"/>

  <!-- round-state ribbon banner -->
  <polygon points="540,352 614,340 614,408 540,420 566,380" fill="#8f2417"/>
  <polygon points="1060,352 986,340 986,408 1060,420 1034,380" fill="#8f2417"/>
  <polygon points="610,414 610,432 632,414" fill="#7a1e12"/>
  <polygon points="990,414 990,432 968,414" fill="#7a1e12"/>
  <rect x="610" y="330" width="380" height="84" fill="url(#redGrad)"/>
  <line x1="610" y1="338" x2="990" y2="338" stroke="#f5e9d0" stroke-width="2" opacity="0.4"/>
  <line x1="610" y1="406" x2="990" y2="406" stroke="#f5e9d0" stroke-width="2" opacity="0.4"/>
  <text x="800" y="390" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="52" letter-spacing="10" fill="#f5e9d0">THROW!</text>

  <!-- score readout -->
  <rect x="190" y="470" width="400" height="214" rx="16" fill="#0a0a1e" stroke="#ffb347" stroke-width="2.5" opacity="0.95"/>
  <text x="390" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" letter-spacing="8" fill="#ffb347">SCORE</text>
  <text x="390" y="648" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="116" letter-spacing="8" fill="#f5e9d0">040</text>

  <!-- balls remaining -->
  <text x="800" y="520" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" letter-spacing="8" fill="#ffb347">BALLS</text>
  <ellipse cx="716" cy="636" rx="32" ry="8" fill="#000000" opacity="0.4"/>
  <ellipse cx="800" cy="636" rx="32" ry="8" fill="#000000" opacity="0.4"/>
  <ellipse cx="884" cy="636" rx="32" ry="8" fill="#000000" opacity="0.4"/>
  <circle cx="716" cy="600" r="30" fill="url(#ballGrad)" stroke="#ffb347" stroke-width="3"/>
  <circle cx="800" cy="600" r="30" fill="url(#ballGrad)" stroke="#ffb347" stroke-width="3"/>
  <circle cx="884" cy="600" r="30" fill="url(#ballGrad)" stroke="#ffb347" stroke-width="3"/>
  <ellipse cx="706" cy="588" rx="9" ry="6" fill="#fffaf0" opacity="0.85"/>
  <ellipse cx="790" cy="588" rx="9" ry="6" fill="#fffaf0" opacity="0.85"/>
  <ellipse cx="874" cy="588" rx="9" ry="6" fill="#fffaf0" opacity="0.85"/>

  <!-- big reset button -->
  <rect x="1030" y="500" width="340" height="184" rx="92" fill="#6e1c10"/>
  <rect x="1030" y="482" width="340" height="184" rx="92" fill="url(#redGrad)" stroke="#f5e9d0" stroke-width="5"/>
  <rect x="1064" y="500" width="272" height="38" rx="19" fill="#ffffff" opacity="0.16"/>
  <text x="1200" y="600" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="70" letter-spacing="10" fill="#f5e9d0">RESET</text>

  <!-- scale annotations (rough real proportions) -->
  <g stroke="#55558a" stroke-width="2" opacity="0.8">
    <line x1="128" y1="762" x2="1472" y2="762"/>
    <line x1="128" y1="752" x2="128" y2="772"/>
    <line x1="1472" y1="752" x2="1472" y2="772"/>
    <line x1="96" y1="170" x2="96" y2="730"/>
    <line x1="86" y1="170" x2="106" y2="170"/>
    <line x1="86" y1="730" x2="106" y2="730"/>
  </g>
  <text x="800" y="792" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="22" letter-spacing="2" fill="#8a8ab0">1.2 m</text>
  <text x="66" y="456" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="22" letter-spacing="2" fill="#8a8ab0" transform="rotate(-90 66 456)">0.5 m</text>
  <text x="800" y="842" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="20" letter-spacing="2" fill="#8a8ab0" opacity="0.8">SPATIAL PANEL — HUNG ABOVE THE CAN SHELF, ~1.6 m HIGH, 2.5 m FROM PLAYER</text>

  <!-- vignette -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#vign)"/>
</svg>
