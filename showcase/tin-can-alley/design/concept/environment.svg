    <line x1="1280" y1="350" x2="1180" y2="625" stroke="#1c1c40" stroke-width="14"/>
    <line x1="1280" y1="350" x2="1380" y2="625" stroke="#1c1c40" stroke-width="14"/>
    <circle cx="1280" cy="350" r="200" fill="none" stroke="#23234c" stroke-width="9"/>
    <circle cx="1280" cy="350" r="168" fill="none" stroke="#23234c" stroke-width="3" opacity="0.7"/>
    <g stroke="#23234c" stroke-width="5">
      <line x1="1080" y1="350" x2="1480" y2="350"/>
      <line x1="1280" y1="150" x2="1280" y2="550"/>
      <line x1="1139" y1="209" x2="1421" y2="491"/>
      <line x1="1139" y1="491" x2="1421" y2="209"/>
    </g>
    <circle cx="1280" cy="350" r="16" fill="#2a2a55"/>
    <g fill="#1c1c40">
      <rect x="1468" y="348" width="22" height="26" rx="6"/>
      <rect x="1269" y="138" width="22" height="26" rx="6"/>
      <rect x="1090" y="348" width="22" height="26" rx="6"/>
      <rect x="1269" y="548" width="22" height="26" rx="6"/>
      <rect x="1410" y="200" width="20" height="24" rx="6"/>
      <rect x="1128" y="200" width="20" height="24" rx="6"/>
      <rect x="1410" y="488" width="20" height="24" rx="6"/>
      <rect x="1128" y="488" width="20" height="24" rx="6"/>
