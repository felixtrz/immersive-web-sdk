    <circle cx="210" cy="60" r="1.4" opacity="0.5"/>
    <circle cx="330" cy="200" r="1.2" opacity="0.4"/>
    <circle cx="450" cy="80" r="1.8" opacity="0.7"/>
    <circle cx="560" cy="150" r="1.2" opacity="0.45"/>
    <circle cx="680" cy="50" r="1.6" opacity="0.6"/>
    <circle cx="800" cy="120" r="1.3" opacity="0.5"/>
    <circle cx="930" cy="70" r="2.2" opacity="0.8"/>
    <circle cx="1040" cy="180" r="1.2" opacity="0.4"/>
    <circle cx="1140" cy="90" r="1.5" opacity="0.55"/>
    <circle cx="1250" cy="50" r="1.8" opacity="0.7"/>
    <circle cx="1420" cy="110" r="1.3" opacity="0.5"/>
    <circle cx="1520" cy="60" r="2" opacity="0.75"/>
    <circle cx="1560" cy="250" r="1.2" opacity="0.4"/>
    <circle cx="160" cy="320" r="1.2" opacity="0.35"/>
    <circle cx="1010" cy="280" r="1.1" opacity="0.3"/>
    <circle cx="1330" cy="130" r="1.2" opacity="0.45"/>
    <circle cx="60" cy="230" r="1.5" opacity="0.55"/>
