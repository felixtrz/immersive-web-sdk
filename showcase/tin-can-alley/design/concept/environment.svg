      <circle cx="1453" cy="250" r="3" opacity="0.6"/>
      <circle cx="1380" cy="177" r="3.5" opacity="0.85"/>
      <circle cx="1280" cy="150" r="3" opacity="0.55"/>
      <circle cx="1180" cy="177" r="3.5" opacity="0.8"/>
      <circle cx="1107" cy="250" r="3" opacity="0.5"/>
      <circle cx="1080" cy="350" r="3.5" opacity="0.9"/>
      <circle cx="1107" cy="450" r="3" opacity="0.6"/>
      <circle cx="1180" cy="523" r="3.5" opacity="0.8"/>
      <circle cx="1280" cy="550" r="3" opacity="0.55"/>
      <circle cx="1380" cy="523" r="3.5" opacity="0.85"/>
      <circle cx="1453" cy="450" r="3" opacity="0.6"/>
    </g>
  </g>

  <!-- LAYER 3: far tent silhouettes + fog -->
  <g fill="#14143a" opacity="0.85">
    <polygon points="0,625 0,555 100,515 200,555 200,625"/>
    <polygon points="215,625 215,580 300,548 385,580 385,625"/>
    <polygon points="940,625 940,572 1030,538 1120,572 1120,625"/>
    <polygon points="1490,625 1490,588 1600,565 1600,625"/>
