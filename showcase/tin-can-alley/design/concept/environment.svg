  <rect x="372" y="266" width="496" height="292" fill="#0d0d22"/>
  <ellipse cx="620" cy="420" rx="230" ry="120" fill="url(#panelGlow)" opacity="0.25"/>
  <rect x="340" y="262" width="32" height="378" fill="url(#awnRed)"/>
  <rect x="868" y="262" width="32" height="378" fill="url(#awnRed)"/>
  <rect x="340" y="614" width="32" height="10" fill="#e0cfa9"/>
  <rect x="868" y="614" width="32" height="10" fill="#e0cfa9"/>

