  <ellipse cx="516" cy="541" rx="21" ry="5" fill="#000000" opacity="0.4"/>
  <ellipse cx="562" cy="541" rx="21" ry="5" fill="#000000" opacity="0.4"/>
  <circle cx="470" cy="523" r="17" fill="url(#ballGrad)"/>
  <circle cx="516" cy="523" r="17" fill="url(#ballGrad)"/>
  <circle cx="562" cy="523" r="17" fill="url(#ballGrad)"/>
  <path d="M 458 512 Q 470 506 480 512" fill="none" stroke="#d4a86a" stroke-width="2" opacity="0.7"/>
  <path d="M 504 512 Q 516 506 526 512" fill="none" stroke="#d4a86a" stroke-width="2" opacity="0.7"/>
  <path d="M 550 512 Q 562 506 572 512" fill="none" stroke="#d4a86a" stroke-width="2" opacity="0.7"/>
  <rect x="356" y="540" width="528" height="14" fill="url(#awnCream)"/>
  <rect x="356" y="554" width="528" height="70" rx="4" fill="url(#awnRed)"/>
  <line x1="366" y1="612" x2="874" y2="612" stroke="#f5e9d0" stroke-width="3" opacity="0.5"/>

  <!-- marquee sign -->
  <ellipse cx="620" cy="118" rx="310" ry="86" fill="url(#panelGlow)" opacity="0.7"/>
  <rect x="400" y="76" width="440" height="84" rx="18" fill="url(#awnRed)" stroke="#f5e9d0" stroke-width="4"/>
  <text x="620" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="42" letter-spacing="4" fill="#f5e9d0">TIN CAN ALLEY</text>
  <g fill="#ffd88a">
    <circle cx="418" cy="94" r="5"/>
    <circle cx="822" cy="94" r="5"/>
    <circle cx="418" cy="142" r="5"/>
    <circle cx="822" cy="142" r="5"/>
    <circle cx="520" cy="84" r="4" opacity="0.8"/>
    <circle cx="720" cy="84" r="4" opacity="0.8"/>
  </g>
  <rect x="470" y="158" width="12" height="14" fill="url(#woodGrad)"/>
  <rect x="758" y="158" width="12" height="14" fill="url(#woodGrad)"/>

  <!-- striped awning with scalloped fringe -->
  <g clip-path="url(#awnClip)">
    <rect x="348" y="168" width="544" height="100" fill="url(#awnCream)"/>
    <rect x="372" y="168" width="56" height="100" fill="url(#awnRed)"/>
    <rect x="484" y="168" width="56" height="100" fill="url(#awnRed)"/>
    <rect x="596" y="168" width="56" height="100" fill="url(#awnRed)"/>
    <rect x="708" y="168" width="56" height="100" fill="url(#awnRed)"/>
    <rect x="820" y="168" width="56" height="100" fill="url(#awnRed)"/>
  </g>
  <rect x="372" y="158" width="496" height="10" rx="5" fill="url(#woodGrad)"/>
  <g>
    <circle cx="368" cy="268" r="20" fill="url(#awnRed)"/>
    <circle cx="416" cy="268" r="20" fill="url(#awnCream)"/>
    <circle cx="464" cy="268" r="20" fill="url(#awnRed)"/>
    <circle cx="512" cy="268" r="20" fill="url(#awnCream)"/>
    <circle cx="560" cy="268" r="20" fill="url(#awnRed)"/>
    <circle cx="608" cy="268" r="20" fill="url(#awnCream)"/>
    <circle cx="656" cy="268" r="20" fill="url(#awnRed)"/>
    <circle cx="704" cy="268" r="20" fill="url(#awnCream)"/>
    <circle cx="752" cy="268" r="20" fill="url(#awnRed)"/>
    <circle cx="800" cy="268" r="20" fill="url(#awnCream)"/>
    <circle cx="848" cy="268" r="20" fill="url(#awnRed)"/>
    <circle cx="892" cy="268" r="20" fill="url(#awnCream)"/>
  </g>

  <!-- LAYER 7: foreground accents -->
  <rect x="60" y="428" width="18" height="472" fill="#14142e"/>
  <path d="M 78 440 Q 220 520 372 268" fill="none" stroke="#26264e" stroke-width="3" opacity="0.8"/>
  <circle cx="150" cy="478" r="16" fill="url(#bulbGlow)"/><circle cx="150" cy="478" r="5" fill="#f0c169" opacity="0.9"/>
  <circle cx="248" cy="490" r="16" fill="url(#bulbGlow)"/><circle cx="248" cy="490" r="5" fill="#f0c169" opacity="0.9"/>
  <ellipse cx="180" cy="852" rx="90" ry="12" fill="#04040f" opacity="0.8"/>
  <ellipse cx="1420" cy="868" rx="120" ry="14" fill="#04040f" opacity="0.8"/>
  <ellipse cx="980" cy="700" rx="10" ry="3" fill="#0a0a1e" opacity="0.9"/>
  <ellipse cx="1060" cy="742" rx="14" ry="4" fill="#0a0a1e" opacity="0.9"/>
  <ellipse cx="330" cy="742" rx="12" ry="3.5" fill="#0a0a1e" opacity="0.9"/>

  <!-- LAYER 8: vignette -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#vign)"/>
</svg>
