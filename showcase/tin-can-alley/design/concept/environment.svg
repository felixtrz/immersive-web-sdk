  <circle cx="1060" cy="592" r="3" fill="#ffb347" opacity="0.6"/>
  <rect x="0" y="560" width="1600" height="70" fill="#3a3a75" opacity="0.18"/>
  <rect x="0" y="596" width="1600" height="40" fill="#3a3a75" opacity="0.15"/>

