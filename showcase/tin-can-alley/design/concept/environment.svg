  <ellipse cx="620" cy="471" rx="110" ry="6" fill="#000000" opacity="0.35"/>
  <use href="#can" transform="translate(576,470)"/>
  <use href="#can" transform="translate(620,470)"/>
  <use href="#can" transform="translate(664,470)"/>
  <use href="#can" transform="translate(598,422)"/>
  <use href="#can" transform="translate(642,422)"/>
  <use href="#can" transform="translate(620,374)"/>

