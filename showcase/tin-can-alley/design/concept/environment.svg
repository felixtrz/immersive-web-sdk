  <line x1="700" y1="270" x2="700" y2="282" stroke="#3a3a6a" stroke-width="3"/>
  <ellipse cx="620" cy="312" rx="180" ry="66" fill="url(#panelGlow)" opacity="0.8"/>
  <rect x="510" y="282" width="220" height="60" rx="10" fill="#0d0d24" stroke="#ffb347" stroke-width="2.5"/>
  <text x="620" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="24" letter-spacing="2" fill="#f5e9d0">SCORE 00</text>
  <circle cx="596" cy="326" r="6" fill="#f5e9d0"/>
  <circle cx="620" cy="326" r="6" fill="#f5e9d0"/>
  <circle cx="644" cy="326" r="6" fill="#f5e9d0"/>

