  <path d="M 880 150 Q 1000 268 1120 240" fill="none" stroke="#3a3a6a" stroke-width="3"/>
  <path d="M 1120 240 Q 1370 300 1620 150" fill="none" stroke="#3a3a6a" stroke-width="3"/>
  <path d="M -20 200 Q 170 268 360 152" fill="none" stroke="#3a3a6a" stroke-width="3"/>
  <g>
    <circle cx="960" cy="240" r="20" fill="url(#bulbGlow)"/><circle cx="960" cy="240" r="6" fill="#ffd88a"/>
    <circle cx="1040" cy="252" r="18" fill="url(#bulbGlow)"/><circle cx="1040" cy="252" r="5.5" fill="#f0c169"/>
    <circle cx="1240" cy="272" r="20" fill="url(#bulbGlow)"/><circle cx="1240" cy="272" r="6" fill="#ffd88a"/>
