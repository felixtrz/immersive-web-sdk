<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Tin Can Alley environment: carnival booth at rest under a night sky, ferris wheel behind">
  <title>Tin Can Alley — Environment (the booth at rest)</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07071a"/>
      <stop offset="0.5" stop-color="#1a1a3e"/>
      <stop offset="1" stop-color="#383873"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e46"/>
      <stop offset="1" stop-color="#07071a"/>
    </linearGradient>
    <linearGradient id="awnRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2543e"/>
      <stop offset="1" stop-color="#b02f1f"/>
    </linearGradient>
    <linearGradient id="awnCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8eed8"/>
      <stop offset="1" stop-color="#e0cfa9"/>
    </linearGradient>
    <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7583"/>
      <stop offset="0.18" stop-color="#d9dee6"/>
      <stop offset="0.42" stop-color="#f2f5f9"/>
      <stop offset="0.75" stop-color="#9aa0ae"/>
      <stop offset="1" stop-color="#5c6270"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3a28"/>
      <stop offset="1" stop-color="#38231a"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="0.36" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#fdf6e4"/>
      <stop offset="0.55" stop-color="#f0e0bd"/>
      <stop offset="1" stop-color="#c8b184"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd88a" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc76b" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffc76b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wheelGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a6bd4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8a6bd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#050510" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#050510" stop-opacity="0"/>
      <stop offset="1" stop-color="#050510" stop-opacity="0.65"/>
    </radialGradient>
    <clipPath id="awnClip">
      <polygon points="380,168 860,168 892,268 348,268"/>
    </clipPath>
    <!-- tin can: 36 x 50, bottom edge at y=0 -->
    <g id="can">
      <rect x="-18" y="-48" width="36" height="46" rx="3" fill="url(#canBody)"/>
      <rect x="-18" y="-33" width="36" height="11" fill="#c8402d"/>
      <ellipse cx="0" cy="-48" rx="18" ry="5" fill="#dfe3ea"/>
      <ellipse cx="0" cy="-48" rx="12" ry="3.2" fill="#a9afbb"/>
      <path d="M -18 -48 A 18 5 0 0 1 18 -48" fill="none" stroke="#fff6df" stroke-width="1.4" opacity="0.8"/>
    </g>
  </defs>

